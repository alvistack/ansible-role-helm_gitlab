# Release name to manage.
helm_gitlab_helm_release_name: gitlab

# Kubernetes namespace where the chart should be installed.
helm_gitlab_helm_release_namespace: gitlab

# Value to pass to chart.
helm_gitlab_helm_release_values:
  global:
    image:
      pullPolicy: IfNotPresent
    edition: ce
    hosts:
      domain: "{{ inventory_hostname }}"
      https: false
      externalIP: "{{ ansible_facts['default_ipv4'].address }}"
      gitlab:
        name: "{{ inventory_hostname }}"
    ingress:
      enabled: true
      class: nginx
      configureCertmanager: false
      path: /
      pathType: ImplementationSpecific
    minio:
      enabled: false
    appConfig:
      lfs:
        enabled: false
      artifacts:
        enabled: false
      uploads:
        enabled: false
      packages:
        enabled: false
      externalDiffs:
        enabled: false
      terraformState:
        enabled: false
      dependencyProxy:
        enabled: false
    kas:
      enabled: false
    certificates:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/certificates
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    kubectl:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/kubectl
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    gitlabBase:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-base
        pullPolicy: IfNotPresent
  installCertmanager: false
  nginx-ingress:
    enabled: false
  prometheus:
    install: false
  redis:
    install: true
    image:
      registry: docker.io
      repository: bitnamilegacy/redis
      pullPolicy: IfNotPresent
    metrics:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/redis-exporter
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  postgresql:
    install: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      pullPolicy: IfNotPresent
    primary:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
    metrics:
      enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/postgres-exporter
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  minio:
    image: docker.io/minio/minio
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    minioMc:
      image: docker.io/minio/mc
      pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  registry:
    enabled: false
    image:
      repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-container-registry
      pullPolicy: IfNotPresent
    hpa:
      minReplicas: 1
      maxReplicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  shared-secrets:
    selfsign:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/cfssl-self-sign
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  gitlab-runner:
    install: false
  gitlab:
    gitaly:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitaly
        pullPolicy: IfNotPresent
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    gitlab-exporter:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-exporter
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    kas:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-kas
        pullPolicy: IfNotPresent
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    gitlab-shell:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-shell
        pullPolicy: IfNotPresent
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    sidekiq:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-sidekiq-ce
        pullPolicy: IfNotPresent
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 1024Mi
    toolbox:
      enabled: false
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce
        pullPolicy: IfNotPresent
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    migrations:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ce
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
    webservice:
      image:
        repository: registry.gitlab.com/gitlab-org/build/cng/gitlab-webservice-ce
        pullPolicy: IfNotPresent
      workhorse:
        image: registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
      deployments:
        default:
          ingress:
            path: /
            pathType: ImplementationSpecific
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 1024Mi
